<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
        div>p{
            color: blue;
        }
        .c1>p{
            color: blue;
        }
        .c1 > div span > .c2{
          color: red;
        }
    </style>
  </head>
  <body>
    <!-- select the direct son and make it blue  -->
    <div class="c1">
      <div>
        <div>
          <span>
            <p class="c2">I'm the direct son</p>
          </span>
        </div>
        </div>
    </div>

    <div class="c1">
      <span>
        <p>I'm the indirect son</p>
      </span>
    </div>

    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Amet reiciendis eum, est in autem, magni inventore dolores doloremque excepturi <span style="font-weight: 600; color: aqua;">hello guys</span> quis optio exercitationem fuga. Cum praesentium <div style="color: red;">quos aut</div> voluptatem, non nesciunt?</p>
  </body>
</html>
